<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"; rel="stylesheet">
    
    <style>
        
        button {
            width: 45%
        }
        body {
            background-image: url('bg.jpg');
            background-size: cover
        }
    </style>

</head>
<body>
    
    <div class="container border border-dark bg-secondary mt-5 w-50 text-center p-3 rounded-5">
        <h1>The Random Calculator</h1>
        <div class="container">
            <details ontoggle="message()">
                <summary>Instructions (Click me!)</summary>
            </details>
        </div>

        <br>
    
        <form>

            
            <input type="number" id="num1" placeholder="Type first number here..." style="margin-bottom: 10px; font-size: 35px; border-radius: 100px; width: 80%; text-align: center;">
            <br>
            
            <input type="number" id="num2" placeholder="Type first number here..." style="margin-bottom: 10px; font-size: 35px; border-radius: 100px; width: 80%; text-align: center;">

            <br>
            <div class="container bg-success w-50 rounded-5 border">
                <span><h1 id="answer">Answer</h1></span>
            </div>
            
                <button type="button" class="btn bg-warning rounded-5 border btn-lg mt-4" onclick="multiply()">MULTIPLY</button>
                <button type="button" class="btn bg-danger rounded-5 border btn-lg mt-4" onclick="remainder()">REMAINDER</button>
                <br>
                <button type="button" class="btn bg-primary rounded-5 border btn-lg mt-2" onclick="exponent()">EXPONENT/POWER</button>
                <button type="button" class="btn bg-info rounded-5 border btn-lg mt-2" onclick="compare()">COMPARE (EQUAL TO)</button>
            

        </form>
    </div>

        <script>
            function message() {
            alert("Test it out by pressing any of the buttons to get an outcome.");
            }
        
            function multiply() {
            var muli1 = document.getElementById("num1").value;
            var muli2 = document.getElementById("num2").value;
            var product = Number (muli1) * Number (muli2);
            document.getElementById('answer').innerHTML='Answer is' + ' ' + product;
            }
            function remainder() {
            var rem1 = document.getElementById("num1").value;
            var rem2 = document.getElementById("num2").value;
            var remainder = Number (rem1) % Number (rem2);
            document.getElementById('answer').innerHTML='Answer is' + ' ' + remainder;
            }
            function exponent() {
            var exp1 = document.getElementById("num1").value;
            var exp2 = document.getElementById("num2").value;
            var answer = Number (exp1) ** Number (exp2);
            document.getElementById('answer').innerHTML='Answer is' + ' ' + answer;
            }
            function compare() {
            var comp1 = document.getElementById("num1").value;
            var comp2 = document.getElementById("num2").value;
            var comparison = Number (comp1) == Number (comp2);
            document.getElementById('answer').innerHTML='Answer is' + ' ' + comparison;
            }
        </script>
    
    
</body>
</html>
